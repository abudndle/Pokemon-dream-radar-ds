name: Five-minute Dream Radar host validation

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'feature/**'
      - 'fix/**'
      - 'dev/**'
  pull_request:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-radar-host-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled-main' || github.ref }}
  cancel-in-progress: true

jobs:
  host-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Run host regression suite
        run: make test-host
      - name: Reject false emulator restart and Orb restoration evidence
        run: |
          python3 tests/test_melonds_cleanup.py
          python3 tests/test_melonds_clean_restart.py
          python3 tests/test_melonds_reward_restart.py
          python3 tests/test_reward_restart_workflow.py
          python3 tests/test_restored_orbs_gate.py
      - name: Run DS and DSi syntax checks
        run: make test-syntax
      - name: Validate ROM header test and asset references
        run: |
          python3 tests/test_nds_header.py
          python3 tools/verify_assets.py
