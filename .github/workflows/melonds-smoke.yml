name: Linux melonDS boot and screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/melonds-smoke.yml'
      - 'scripts/melonds_smoke.sh'
      - 'source/**'
      - 'nitrofs/**'
      - 'Makefile'
      - 'scripts/build_both.sh'
      - 'scripts/check_nds.py'
      - 'tools/verify_melonds_navigation.py'
      - 'source/font6.h'
jobs:
  melonds-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Flatpak and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak xvfb xauth xdotool imagemagick x11-utils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Install official melonDS Flatpak
        run: |
          sudo flatpak install --noninteractive -y flathub net.kuribo64.melonDS
          flatpak info net.kuribo64.melonDS
      - name: Build latest DS/DSi ROM
        run: |
          python3 tools/stage_title_ui.py ui_mapping/original_pane_geometry.json nitrofs/title.drui
          python3 tools/stage_scan_ui.py ui_mapping/original_pane_geometry.json nitrofs/scan.drui
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e SKIP_HOST_TESTS=1 -e SKIP_ROM_CHECK=1 \
            skylyrac/blocksds@sha256:779f6193d1030c62e60d1f0f39c3e32cf4045c0bd224a45c0ceadf9d9ab01a51 sh scripts/build_both.sh
          python3 scripts/check_nds.py dream_radar.nds
      - name: Configure melonDS keyboard mappings
        run: |
          mkdir -p "$HOME/.var/app/net.kuribo64.melonDS/config/melonDS"
          cat > "$HOME/.var/app/net.kuribo64.melonDS/config/melonDS/melonDS.toml" <<'EOF'
          [Instance0]
          [Instance0.Keyboard]
          A = 90
          B = 88
          X = 65
          Y = 83
          Left = 16777234
          Right = 16777236
          Up = 16777235
          Down = 16777237
          L = 81
          R = 87
          Select = 16777221
          Start = 16777220
          EOF
          cat "$HOME/.var/app/net.kuribo64.melonDS/config/melonDS/melonDS.toml"
      - name: Launch melonDS and capture actual emulator window
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24' \
            bash scripts/melonds_smoke.sh dream_radar.nds melonds-results
      - name: Publish melonDS screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-melonds-real-screenshots
          path: |
            melonds-results/*.png
            melonds-results/*.log
            melonds-results/*.txt
            melonds-results/*.json
          if-no-files-found: warn
          retention-days: 30
