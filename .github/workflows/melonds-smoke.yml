name: Linux melonDS boot and screenshots
on:
  workflow_dispatch:
    inputs:
      require_touch:
        description: 'Fail unless title-screen stylus navigation is verified'
        type: boolean
        required: false
        default: false
      require_capture:
        description: 'Require verified live capture reward (fails if none observed)'
        type: boolean
        required: false
        default: false
      require_orb_collection:
        description: 'Require a saved Orb balance increase across the live search'
        type: boolean
        required: false
        default: false
      require_restart_persistence:
        description: 'Require writable DLDI save and exact restored Orb balance in fresh melonDS process'
        type: boolean
        required: false
        default: false
      capture_sweep_steps:
        description: 'Maximum live sphere pursuit steps (1–160)'
        type: choice
        options: ['40', '80', '160']
        required: false
        default: '160'
  push:
    branches: [main, milestone-next-parity-audit-20261101]
  pull_request:
    paths:
      - '.github/workflows/melonds-smoke.yml'
      - 'scripts/melonds_smoke.sh'
      - 'source/**'
      - 'nitrofs/**'
      - 'Makefile'
      - 'scripts/build_both.sh'
      - 'scripts/check_nds.py'
      - 'tools/verify_melonds_navigation.py'
      - 'tools/validate_navigation_evidence.py'
      - 'tests/test_navigation_evidence.py'
      - 'tools/plan_melonds_aim.py'
      - 'tests/test_melonds_navigation.py'
      - 'tests/test_melonds_aim.py'
      - 'source/font6.h'
jobs:
  melonds-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate encounter recognition and smoke-script syntax
        run: |
          bash -n scripts/melonds_smoke.sh
          python3 -m py_compile tools/verify_melonds_navigation.py tools/validate_navigation_evidence.py tools/plan_melonds_aim.py
          python3 tests/test_navigation_evidence.py
          python3 tests/test_melonds_navigation.py
          python3 tests/test_melonds_aim.py
      - name: Install native melonDS dependencies and screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl unzip xvfb xauth xdotool imagemagick x11-utils dbus-daemon qt6-base-dev qt6-multimedia-dev libqt6svg6 libenet7 libsdl2-2.0-0 libslirp0 libfaad2
      - name: Validate PNG-backed capture and reward CLI after ImageMagick install
        run: |
          python3 tests/test_melonds_navigation.py
      - name: Install checksum-pinned official melonDS 1.1 Ubuntu x86_64 binary
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/melonds-1.1.zip" \
            https://github.com/melonDS-emu/melonDS/releases/download/1.1/melonDS-1.1-ubuntu-x86_64.zip
          echo '99465129f5413b2aad332e4377e523cf3cda905dc329d47dcb1ad01ce2cb3f66  '"$RUNNER_TEMP/melonds-1.1.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/melonds-native"
          unzip -q "$RUNNER_TEMP/melonds-1.1.zip" -d "$RUNNER_TEMP/melonds-native"
          binary="$(find "$RUNNER_TEMP/melonds-native" -type f -name melonDS -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          echo "MELONDS_BIN=$binary" >> "$GITHUB_ENV"
          ldd "$binary" | tee "$RUNNER_TEMP/melonds-native-dependencies.txt"
          if grep -q 'not found' "$RUNNER_TEMP/melonds-native-dependencies.txt"; then
            echo 'Missing official melonDS native dependencies' >&2
            exit 1
          fi
      - name: Build latest DS/DSi ROM
        run: |
          python3 tools/stage_title_ui.py ui_mapping/original_pane_geometry.json nitrofs/title.drui
          python3 tools/stage_title_ui.py ui_mapping/original_pane_geometry.json nitrofs/scanlist.drui --layout MnIf_S_ScanList.bclyt
          python3 tools/stage_title_ui.py ui_mapping/original_pane_geometry.json nitrofs/mainmenu.drui --layout MnIf_S_MainMenuList.bclyt --offset-y 24
          python3 tools/stage_title_ui.py ui_mapping/original_pane_geometry.json nitrofs/shoplist.drui --layout MnIf_S_ShopList.bclyt
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e SKIP_HOST_TESTS=1 -e SKIP_ROM_CHECK=1 \
            skylyrac/blocksds@sha256:779f6193d1030c62e60d1f0f39c3e32cf4045c0bd224a45c0ceadf9d9ab01a51 sh scripts/build_both.sh
          python3 scripts/check_nds.py dream_radar.nds
      - name: Configure melonDS keyboard mappings
        run: |
          mkdir -p "$HOME/.config/melonDS"
          cat > "$HOME/.config/melonDS/melonDS.toml" <<'EOF'
          [Instance0]
          [Instance0.Keyboard]
          A = 90
          B = 88
          X = 65
          Y = 83
          Left = 16777234
          Right = 16777236
          Up = 16777235
          Down = 16777237
          L = 81
          R = 87
          Select = 16777221
          Start = 16777220
          EOF
          cat >> "$HOME/.config/melonDS/melonDS.toml" <<EOF
          [DLDI]
          Enable = true
          FolderSync = true
          ReadOnly = false
          ImageSize = 1073741824
          FolderPath = "$GITHUB_WORKSPACE/melonds-dldi"
          EOF
          mkdir -p "$GITHUB_WORKSPACE/melonds-dldi/saves"
          cp dream_radar.nds "$GITHUB_WORKSPACE/melonds-dldi/dream_radar.nds"
          cat "$HOME/.config/melonDS/melonDS.toml"
      - name: Launch melonDS and capture actual emulator window
        env:
          REQUIRE_TOUCH: ${{ inputs.require_touch && '1' || '0' }}
          REQUIRE_CAPTURE: ${{ inputs.require_capture && '1' || '0' }}
          REQUIRE_ORB_COLLECTION: ${{ inputs.require_orb_collection && '1' || '0' }}
          CAPTURE_SWEEP_STEPS: ${{ inputs.capture_sweep_steps || '160' }}
        run: |
          xvfb-run -a -s '-screen 0 1280x900x24' \
            env QT_QPA_PLATFORM=xcb QT_QPA_PLATFORMTHEME=generic GSETTINGS_BACKEND=memory \
            dbus-run-session -- bash scripts/melonds_smoke.sh "$GITHUB_WORKSPACE/melonds-dldi/dream_radar.nds" melonds-results
          if [[ "${{ inputs.require_restart_persistence && '1' || '0' }}" == 1 ]]; then
            test -s melonds-dldi/saves/dream_radar.dreamradar.sav
            python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('melonds-results/orb-balance-change.json').read_text())
          if not p['balance_increased']:
              raise SystemExit('No first-process Orb balance gain; cannot prove restart persistence')
          Path('melonds-first-gained.json').write_text(json.dumps(p['after']))
          PY
            xvfb-run -a -s '-screen 0 1280x900x24' \
              env QT_QPA_PLATFORM=xcb QT_QPA_PLATFORMTHEME=generic GSETTINGS_BACKEND=memory REQUIRE_PREEXISTING_ORB=1 \
              dbus-run-session -- bash scripts/melonds_smoke.sh "$GITHUB_WORKSPACE/melonds-dldi/dream_radar.nds" melonds-restart-results
            python3 - <<'PY'
          import json
          from pathlib import Path
          first=json.loads(Path('melonds-first-gained.json').read_text())['saved_orbs']
          second=json.loads(Path('melonds-restart-results/orb-balance-before.json').read_text())['saved_orbs']
          if first != second:
              raise SystemExit(f'Orb balance not restored: expected {first}, observed {second}')
          print(f'PASS: clean emulator restart restored exactly {second} saved Orbs')
          PY
          fi
      - name: Publish melonDS screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-melonds-real-screenshots
          path: |
            melonds-results/*.png
            melonds-results/*.log
            melonds-results/*.txt
            melonds-results/*.json
            melonds-restart-results/*.png
            melonds-restart-results/*.log
            melonds-restart-results/*.json
          if-no-files-found: warn
          retention-days: 30
