name: BlocksDS dual-target build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable logic and platform tests
        run: |
          make test-host test-syntax
          python3 tests/test_nds_header.py
          python3 tools/verify_assets.py
  arm-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile both targets in BlocksDS image
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            skylyrac/blocksds:slim-latest sh -eu -c '
              for platform in ds dsi; do
                # Rebuild ARM9 objects for each platform; DS and DSi use different defines/specs.
                rm -rf build
                make "PLATFORM=$platform" check-sdk
                make "PLATFORM=$platform" -j2
                rom="dream_radar_${platform}.nds"
                test -s "$rom"
              done
            '
      - name: Validate DS and DSi ROMs on Ubuntu
        run: |
          python3 scripts/check_nds.py dream_radar_ds.nds
          python3 scripts/check_nds.py dream_radar_dsi.nds
      - name: Upload untested ROMs
        uses: actions/upload-artifact@v4
        with:
          name: untested-blocksds-roms
          path: |
            dream_radar_ds.nds
            dream_radar_dsi.nds
          if-no-files-found: error
