name: BlocksDS unified DS/DSi build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, milestone-next-parity-audit-20261101]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable logic and platform tests
        run: |
          make test-host test-syntax
          python3 tests/test_nds_header.py
          python3 tools/verify_assets.py
  arm-binaries:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export retargeted original UI pane geometry
        run: |
          python3 tools/retarget_panes.py ui_mapping/original_pane_geometry.json build/original_ui_ds_panes.json
      - name: Upload DS-scaled original UI layout reference
        uses: actions/upload-artifact@v4
        with:
          name: original-3ds-ui-layouts-ds-coordinates
          path: build/original_ui_ds_panes.json
          if-no-files-found: error
      - name: Audit original 3DS UI source availability
        run: |
          python3 tools/audit_original_ui.py ui_mapping/original_pane_geometry.json ui_mapping/original_ui build/original_ui_asset_audit.json
      - name: Upload original UI asset coverage report
        uses: actions/upload-artifact@v4
        with:
          name: original-3ds-ui-source-coverage
          path: build/original_ui_asset_audit.json
          if-no-files-found: error
      - name: Compile enhanced ROM with DS fallback
        run: |
          python3 tools/stage_title_ui.py ui_mapping/original_pane_geometry.json nitrofs/title.drui
          python3 tools/stage_title_ui.py ui_mapping/original_pane_geometry.json nitrofs/scanlist.drui --layout MnIf_S_ScanList.bclyt
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e SKIP_HOST_TESTS=1 -e SKIP_ROM_CHECK=1 \
            skylyrac/blocksds:slim-latest sh scripts/build_both.sh
      - name: Validate unified ROM on Ubuntu
        run: |
          python3 scripts/check_nds.py dream_radar.nds
      - name: Upload untested ROMs
        uses: actions/upload-artifact@v4
        with:
          name: untested-dream-radar-ds-dsi
          path: |
            dream_radar.nds
          if-no-files-found: error
