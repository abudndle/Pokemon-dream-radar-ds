name: Dream Radar capture host acceptance
on:
  push:
    branches: [main, milestone-next-parity-audit-20261101]
  pull_request:
    paths:
      - 'source/**'
      - 'tests/**'
      - 'scripts/melonds_smoke.sh'
      - 'tools/audit_capture_milestone.py'
      - 'tools/analyze_sphere_motion.py'
      - 'tools/detect_projectile_interference.py'
      - 'tests/test_capture_emulator_evidence.py'
      - 'docs/PARALLEL_PORT_WORKSTREAMS.md'
      - 'Makefile'
      - '.github/workflows/capture-host-acceptance.yml'
  workflow_dispatch:
# Cancel superseded PR/push runs; preserve individually dispatched acceptance
# evidence instead of letting rapid development saturate hosted runners.
concurrency:
  group: dream-radar-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  host-capture-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run host acceptance and retain its evidence
        run: |
          mkdir -p capture-evidence
          printf '%s\\n' "commit=$GITHUB_SHA" "run=$GITHUB_RUN_ID" > capture-evidence/build-context.txt
          python3 tools/audit_capture_milestone.py --run-host > capture-evidence/host-audit.json
      - name: Upload capture host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-host-evidence
          path: capture-evidence/
      - name: Guard main-branch capture acceptance trigger
        run: python3 tests/test_capture_host_main_push.py
      - name: Reject incomplete emulator capture evidence
        run: python3 tests/test_capture_emulator_evidence.py
      - name: Guard radar input parity
        run: python3 tests/test_radar_input_parity.py
      - name: Run screenshot recognition regression checks
        run: python3 tests/test_melonds_navigation.py
      - name: Reject false clean-restart Orb evidence
        run: |
          python3 tests/test_melonds_cleanup.py
          python3 tests/test_melonds_clean_restart.py
          python3 tests/test_melonds_reward_restart.py
          python3 tests/test_reward_restart_workflow.py
